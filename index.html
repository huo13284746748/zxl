<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>执行力工作台</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --text-2: #6b7280;
    --text-3: #9ca3af;
    --accent: #3b82a3;      /* 低饱和蓝 */
    --accent-soft: #eef4f7;
    --done: #c0c4c9;
    --danger: #b45353;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    font-size: 15px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 80px; }

  /* ===== 顶部 ===== */
  header { margin-bottom: 20px; }
  .topline {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    justify-content: space-between;
  }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  .brand small { font-weight: 400; color: var(--text-3); font-size: 12px; margin-left: 8px; }

  /* 今日进度 */
  .progress-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .progress-bar {
    flex: 1; height: 8px; background: #eceff1; border-radius: 999px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0; background: var(--accent); border-radius: 999px;
    transition: width .2s ease;
  }
  .progress-txt { font-size: 13px; color: var(--text-2); white-space: nowrap; min-width: 90px; }
  .streak { font-size: 13px; color: var(--text-2); white-space: nowrap; }

  /* ===== 标签页 ===== */
  nav.tabs {
    display: flex; gap: 4px; margin: 20px 0 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  nav.tabs button {
    background: none; border: none; cursor: pointer;
    padding: 10px 16px; font-size: 15px; color: var(--text-2);
    border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  nav.tabs button.active { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
  nav.tabs button:hover { color: var(--text); }

  section.pane { display: none; }
  section.pane.active { display: block; }
  .pane-title { font-size: 13px; color: var(--text-3); margin-bottom: 14px; }

  /* ===== 通用卡片 / 输入 ===== */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  input[type="text"], textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 6px;
    padding: 9px 12px; font-size: 14px; font-family: inherit; color: var(--text);
    background: #fff; outline: none;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 60px; }
  .btn {
    border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 6px; padding: 8px 14px; font-size: 14px; cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #347490; color: #fff; }
  .btn-xs { padding: 2px 8px; font-size: 12px; border-radius: 5px; }

  /* ===== 四象限（十字坐标图） ===== */
  .quad-matrix {
    display: grid;
    grid-template-columns: 26px 1fr;
    grid-template-rows: 1fr 20px;
    gap: 6px 8px;
  }
  .qm-axis { font-size: 11px; color: var(--text-3); }
  .qm-axis-y {
    grid-column: 1; grid-row: 1;
    display: flex; flex-direction: column; justify-content: space-between;
    align-items: center; writing-mode: vertical-rl; letter-spacing: 2px;
  }
  .qm-axis-x {
    grid-column: 2; grid-row: 2;
    display: flex; justify-content: space-between; align-items: center;
  }
  .qm-cells {
    grid-column: 2; grid-row: 1;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: 8px;
  }
  .qm-cells .quad { min-height: 220px; }
  .quad { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); padding: 14px; display: flex; flex-direction: column; min-height: 200px; }
  .quad-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .quad-name { font-weight: 600; font-size: 15px; }
  .quad-hint { font-size: 12px; color: var(--text-3); }
  .quad-count { font-size: 12px; color: var(--text-2); }
  .quad.q2 { border-color: var(--accent); background: #fbfdfe; }
  .q2 .quad-name { color: var(--accent); }
  .quad-list { flex: 1; min-height: 40px; }
  .task {
    display: flex; align-items: center; gap: 8px; padding: 8px 6px;
    border-bottom: 1px solid #f1f3f5; cursor: grab; border-radius: 4px;
  }
  .task:hover { background: var(--accent-soft); }
  .task.dragging { opacity: .4; }
  .task input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; }
  .task .txt { flex: 1; word-break: break-word; }
  .task.done .txt { text-decoration: line-through; color: var(--done); }
  .task.done { opacity: .55; }
  .task .del, .task .move {
    border: none; background: none; color: var(--text-3); cursor: pointer;
    font-size: 14px; padding: 0 4px; visibility: hidden;
  }
  .task:hover .del, .task:hover .move { visibility: visible; }
  .task .del:hover { color: var(--danger); }
  .task .move:hover { color: var(--accent); }
  .quad-input {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 12px; min-height: 112px; margin-top: 10px;
    line-height: 28px; resize: none;
    background: repeating-linear-gradient(transparent, transparent 27px, #eef0f2 27px, #eef0f2 28px);
    background-attachment: local;
  }
  .quad-add {
    align-self: flex-end; margin-top: 8px;
    border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  .quad-add:hover { border-color: var(--accent); color: var(--accent); }
  .quad.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .move-menu {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 6px;
    border: 1px solid var(--border); border-radius: 6px; background: #fff;
    margin: 4px 0; box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .move-menu button {
    font-size: 12px; padding: 6px 10px; border: 1px solid var(--border);
    background: #fff; border-radius: 5px; cursor: pointer; color: var(--text);
  }
  .move-menu button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .move-menu button:disabled { color: var(--text-3); cursor: default; }

  /* ===== 备忘录 ===== */
  .memo-input-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .memo-list { display: flex; flex-direction: column; gap: 8px; }
  .memo {
    display: flex; align-items: flex-start; gap: 10px;
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px; background: var(--card);
  }
  .memo .m-body { flex: 1; }
  .memo .m-time { font-size: 12px; color: var(--text-3); }
  .memo.done .m-text { text-decoration: line-through; color: var(--done); }
  .memo.pinned { border-color: var(--accent); }
  .m-actions { display: flex; gap: 6px; }

  /* ===== 逻辑本（横格纸） ===== */
  .note-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .note-form textarea {
    min-height: 180px; line-height: 28px; padding: 10px 12px;
    background: repeating-linear-gradient(transparent, transparent 27px, #eef0f2 27px, #eef0f2 28px);
    background-attachment: local; border-top: none; border-left: none; border-right: none;
  }
  .note-list { display: flex; flex-direction: column; gap: 12px; }
  .note-item { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; background: var(--card); }
  .note-item .n-time { font-size: 12px; color: var(--text-3); margin-bottom: 8px; }
  .note-item .n-body {
    white-space: pre-wrap; word-break: break-word; line-height: 28px;
    background: repeating-linear-gradient(transparent, transparent 27px, #eef0f2 27px, #eef0f2 28px);
  }
  .note-item .n-del { margin-top: 10px; }

  /* ===== 计划本 ===== */
  .plan-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .plan-nav .date { font-weight: 600; font-size: 16px; min-width: 110px; text-align: center; }
  .plan-table { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .plan-row {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 12px; background: var(--card);
  }
  .plan-row .pr-check { width: 18px; height: 18px; cursor: pointer; flex: 0 0 auto; }
  .plan-row .pr-time { min-width: 92px; color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .plan-row .pr-title { flex: 1; word-break: break-word; }
  .plan-row.done { opacity: .55; }
  .plan-row.done .pr-title { text-decoration: line-through; color: var(--done); }
  .plan-row .pr-del { border: none; background: none; color: var(--text-3); cursor: pointer; font-size: 18px; padding: 0 4px; }
  .plan-row .pr-del:hover { color: var(--danger); }
  .plan-add { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .plan-add .plan-time { width: auto; padding: 7px 10px; flex: 0 0 150px; }
  .plan-stats { display: flex; gap: 18px; font-size: 13px; color: var(--text-2); margin-bottom: 12px; }

  /* ===== 回顾 ===== */
  .review-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-label { width: 110px; font-size: 13px; color: var(--text-2); }
  .bar-track { flex: 1; height: 18px; background: #eceff1; border-radius: 4px; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
  .bar-num { width: 30px; font-size: 13px; text-align: right; }

  .empty { color: var(--text-3); font-size: 13px; padding: 12px 4px; }

  /* ===== 复盘本 ===== */
  .reflect-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .reflect-date { width: auto; max-width: 170px; }
  .reflect-item {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; background: var(--card); margin-bottom: 12px;
  }
  .reflect-item .r-date { font-size: 12px; color: var(--text-3); margin-bottom: 8px; }
  .reflect-item .r-block { margin-bottom: 10px; }
  .reflect-item .r-block h5 { font-size: 12px; color: var(--text-2); font-weight: 600; margin-bottom: 2px; }
  .reflect-item .r-block p { white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .reflect-item .r-del { margin-top: 2px; }

  @media (max-width: 720px) {
    .wrap { padding: 16px 12px 72px; }
    .topline { flex-direction: column; align-items: stretch; gap: 10px; }
    .brand { font-size: 18px; }
    .btn { padding: 10px 14px; font-size: 14px; }
    input[type="text"], textarea { font-size: 16px; }
    .progress-row { flex-wrap: wrap; gap: 8px; }
    .progress-txt { min-width: auto; font-size: 12px; }
    .streak { font-size: 12px; }
    nav.tabs { margin: 16px 0; }
    nav.tabs button { padding: 12px 14px; font-size: 14px; }
    .qm-cells { grid-column: 1; grid-row: 1; grid-template-columns: 1fr; grid-template-rows: auto; }
    .qm-axis-y { display: none; }
    .quad-matrix { grid-template-columns: 1fr; grid-template-rows: auto 20px; }
    .qm-axis-x { grid-column: 1; grid-row: 2; }
    .quad { min-height: 120px; padding: 12px; }
    .task { padding: 10px 4px; }
    .task input[type="checkbox"] { width: 20px; height: 20px; }
    .task .del, .task .move { visibility: visible; font-size: 18px; padding: 0 6px; }
    .review-grid { grid-template-columns: 1fr; }
    .memo-input-row { flex-direction: column; }
    .memo .m-actions { flex-wrap: wrap; }
    .plan-nav { flex-wrap: wrap; gap: 8px; }
    .plan-stats { flex-wrap: wrap; gap: 8px 14px; }
    .plan-row .pr-time { min-width: 78px; }
    #planTitle { flex: 1 1 100%; }
    .plan-add .plan-time { width: auto; flex: 0 0 auto; min-width: 84px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topline">
      <div class="brand">执行力工作台<small>想清楚 · 记下来 · 想明白 · 排到位</small></div>
    </div>
    <div class="progress-row">
      <span class="progress-txt" id="progressTxt">今日完成 0%</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="streak" id="streakTxt">连续坚持 0 天</span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-pane="quad" class="active">四象限</button>
    <button data-pane="memo">备忘录</button>
    <button data-pane="logic">逻辑本</button>
    <button data-pane="plan">计划本</button>
    <button data-pane="reflect">复盘本</button>
    <button data-pane="review">回顾</button>
  </nav>

  <!-- 四象限 -->
  <section class="pane active" id="pane-quad">
    <div class="pane-title">按重要性 / 紧急性给事情分类 —— 重要不紧急是执行力的关键</div>
    <div class="quad-matrix">
      <div class="qm-axis qm-axis-y"><span>重要</span><span>不重要</span></div>
      <div class="qm-cells" id="quadGrid"></div>
      <div class="qm-axis qm-axis-x"><span>不紧急</span><span>紧急</span></div>
    </div>
  </section>

  <!-- 备忘录 -->
  <section class="pane" id="pane-memo">
    <div class="pane-title">快速记录待办与杂事，处理完勾掉，或一键转入四象限</div>
    <div class="memo-input-row">
      <input type="text" id="memoInput" placeholder="记录一件事，回车保存…">
      <button class="btn btn-primary" id="memoAdd">添加</button>
    </div>
    <div class="memo-list" id="memoList"></div>
  </section>

  <!-- 逻辑本 -->
  <section class="pane" id="pane-logic">
    <div class="pane-title">横格纸，想写什么就写什么，不用分门别类</div>
    <div class="note-form card">
      <textarea id="noteContent" placeholder="在这里随便写…"></textarea>
      <button class="btn btn-primary" id="noteSave">保存</button>
    </div>
    <div class="note-list" id="noteList"></div>
  </section>

  <!-- 计划本 -->
  <section class="pane" id="pane-plan">
    <div class="pane-title">把四象限里的事排进具体时间，时间自己填、怎么舒服怎么记</div>
    <div class="plan-nav">
      <button class="btn" id="planPrev">‹ 前一天</button>
      <div class="date" id="planDate"></div>
      <button class="btn" id="planNext">后一天 ›</button>
      <button class="btn" id="planToday">回到今天</button>
    </div>
    <div class="plan-stats" id="planStats"></div>
    <div class="plan-add">
      <input type="text" class="plan-time" id="planTime" placeholder="时间 如 9:00-10:30">
      <input type="text" id="planTitle" placeholder="计划事项…">
      <button class="btn btn-primary" id="planAddBtn">添加</button>
    </div>
    <div class="plan-table" id="planTable"></div>
  </section>

  <!-- 复盘本 -->
  <section class="pane" id="pane-reflect">
    <div class="pane-title">每天复盘：记下没做好的、想出改进办法、沉淀经验体会</div>
    <div class="card reflect-form">
      <input type="date" id="reflectDate" class="reflect-date">
      <textarea id="reflectBad" placeholder="执行力上做得不好的地方…"></textarea>
      <textarea id="reflectImprove" placeholder="我打算怎么改进…"></textarea>
      <textarea id="reflectLesson" placeholder="沉淀下来的经验 / 体会…"></textarea>
      <button class="btn btn-primary" id="reflectSave">保存复盘</button>
    </div>
    <div class="reflect-list" id="reflectList"></div>
  </section>

  <!-- 回顾 -->
  <section class="pane" id="pane-review">
    <div class="pane-title">本周执行情况</div>
    <div class="review-grid">
      <div class="card">
        <h3 style="font-size:14px;margin-bottom:12px;">本周完成</h3>
        <div id="reviewWeek"></div>
      </div>
      <div class="card">
        <h3 style="font-size:14px;margin-bottom:12px;">四象限分布（本周完成）</h3>
        <div id="reviewQuad"></div>
      </div>
    </div>
  </section>
</div>

<script>
/* ================= 工具函数 ================= */
function dateKey(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

const QUAD_NAMES = ['重要且紧急', '重要不紧急', '紧急不重要', '不重要不紧急'];
const QUAD_HINTS = ['立刻做', '计划做 · 关键区', '委托 / 压缩', '删掉'];

/* ================= 状态与持久化 ================= */
const defaultState = {
  quad: [[], [], [], []],   // 每项 {id,text,done,createdAt}
  memos: [],                // {id,text,done,pinned,createdAt}
  decisions: [],            // {id,title,goal,options,criteria,scores,conclusion}
  plans: {},                // { 'YYYY-MM-DD': [{id,title,start,end,done}] }
  reviews: [],              // {id,date,bad,improve,lesson,createdAt}
  notes: [],                // {id,title,content,createdAt}
  streak: { last: '', count: 0 },
  focus: []                 // 四象限任务 id，用于"今日聚焦"（预留）
};

function clone(o) { return JSON.parse(JSON.stringify(o)); }
let state;
try {
  state = JSON.parse(localStorage.getItem('exec_state_v1')) || clone(defaultState);
} catch (e) { state = clone(defaultState); }
// 补齐字段
state.quad = state.quad.length === 4 ? state.quad : [[], [], [], []];
state.memos = state.memos || [];
state.decisions = state.decisions || [];
state.plans = state.plans || {};
state.reviews = state.reviews || [];
state.notes = state.notes || [];
state.streak = state.streak || { last: '', count: 0 };

function save() {
  localStorage.setItem('exec_state_v1', JSON.stringify(state));
  renderAll();
}

/* ================= 连续坚持天数 ================= */
function markDoneToday() {
  const today = dateKey();
  if (state.streak.last === today) return;
  const yesterday = dateKey(new Date(Date.now() - 86400000));
  state.streak.count = (state.streak.last === yesterday) ? state.streak.count + 1 : 1;
  state.streak.last = today;
}

/* ================= 今日完成率 ================= */
function computeProgress() {
  const today = dateKey();
  let planTotal = 0, planDone = 0;
  (state.plans[today] || []).forEach(p => { planTotal++; if (p.done) planDone++; });
  let quadTotal = 0, quadDone = 0;
  state.quad.forEach(q => q.forEach(t => { quadTotal++; if (t.done) quadDone++; }));
  const total = planTotal + quadTotal;
  const done = planDone + quadDone;
  const pct = total === 0 ? 0 : Math.round(done / total * 100);
  return { total, done, pct };
}

/* ================= 标签页切换 ================= */
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('button[data-pane]');
  if (!btn) return;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('section.pane').forEach(p => p.classList.remove('active'));
  document.getElementById('pane-' + btn.dataset.pane).classList.add('active');
});

/* ================= 四象限 ================= */
const quadGrid = document.getElementById('quadGrid');
function renderQuad() {
  quadGrid.innerHTML = '';
  // 坐标顺序：左上(重要不紧急)、右上(重要紧急)、左下(不重要不紧急)、右下(紧急不重要)
  const order = [1, 0, 3, 2];
  order.forEach(qi => {
    const tasks = state.quad[qi];
    const quad = document.createElement('div');
    quad.className = 'quad' + (qi === 1 ? ' q2' : '');
    quad.dataset.qi = qi;
    quad.innerHTML = `
      <div class="quad-head">
        <div><span class="quad-name">${QUAD_NAMES[qi]}</span></div>
        <div class="quad-count">${tasks.filter(t => !t.done).length} / ${tasks.length}</div>
      </div>
      <div class="quad-hint">${QUAD_HINTS[qi]}</div>
      <div class="quad-list" data-qi="${qi}"></div>
      <textarea class="quad-input" data-qi="${qi}" placeholder="每行一条任务"></textarea>
      <button class="quad-add">添加</button>
    `;
    quadGrid.appendChild(quad);
    const list = quad.querySelector('.quad-list');
    tasks.forEach(t => list.appendChild(renderTask(t, qi)));
    // 输入：多行横格，Ctrl+回车 或失焦时按行拆成任务
    const ta = quad.querySelector('.quad-input');
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        flushQuadInput(quad, qi);
      }
    });
    ta.addEventListener('blur', () => flushQuadInput(quad, qi));
    quad.querySelector('.quad-add').addEventListener('click', () => flushQuadInput(quad, qi));
    // 拖放目标
    quad.addEventListener('dragover', e => { e.preventDefault(); quad.classList.add('over'); });
    quad.addEventListener('dragleave', () => quad.classList.remove('over'));
    quad.addEventListener('drop', e => {
      e.preventDefault(); quad.classList.remove('over');
      const id = e.dataTransfer.getData('text/plain');
      const { task, fromQi } = findTask(id);
      if (!task) return;
      if (fromQi !== qi) {
        state.quad[fromQi] = state.quad[fromQi].filter(t => t.id !== id);
        state.quad[qi].push(task);
        save();
      }
    });
  });
}
function flushQuadInput(quad, qi) {
  const ta = quad.querySelector('.quad-input');
  const lines = ta.value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!lines.length) return;
  lines.forEach(line => state.quad[qi].push({ id: uid(), text: line, done: false, createdAt: Date.now() }));
  ta.value = '';
  save();
}
function renderTask(task, qi) {
  const div = document.createElement('div');
  div.className = 'task' + (task.done ? ' done' : '');
  div.draggable = true;
  div.innerHTML = `
    <input type="checkbox" ${task.done ? 'checked' : ''}>
    <span class="txt"></span>
    <button class="move" title="移动到其他象限">⇄</button>
    <button class="del" title="删除">×</button>
  `;
  div.querySelector('.txt').textContent = task.text;
  div.querySelector('input').addEventListener('change', e => {
    task.done = e.target.checked;
    if (task.done) markDoneToday();
    save();
  });
  div.querySelector('.del').addEventListener('click', () => {
    state.quad[qi] = state.quad[qi].filter(t => t.id !== task.id);
    save();
  });
  div.querySelector('.move').addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.move-menu').forEach(m => m.remove());
    const menu = document.createElement('div');
    menu.className = 'move-menu';
    menu.innerHTML = QUAD_NAMES.map((n, i) =>
      `<button data-tqi="${i}" ${i === qi ? 'disabled' : ''}>${i === qi ? '「' + n + '」当前' : '移到 · ' + n}</button>`
    ).join('');
    div.parentNode.insertBefore(menu, div.nextSibling);
    menu.querySelectorAll('button:not(:disabled)').forEach(b => b.addEventListener('click', () => {
      const tqi = Number(b.dataset.tqi);
      state.quad[qi] = state.quad[qi].filter(t => t.id !== task.id);
      state.quad[tqi].push(task);
      save();
    }));
  });
  div.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', task.id);
    div.classList.add('dragging');
  });
  div.addEventListener('dragend', () => div.classList.remove('dragging'));
  return div;
}
function findTask(id) {
  for (let qi = 0; qi < 4; qi++) {
    const t = state.quad[qi].find(x => x.id === id);
    if (t) return { task: t, fromQi: qi };
  }
  return null;
}

/* ================= 备忘录 ================= */
const memoList = document.getElementById('memoList');
const memoInput = document.getElementById('memoInput');
function addMemo() {
  const text = memoInput.value.trim();
  if (!text) return;
  state.memos.unshift({ id: uid(), text, done: false, pinned: false, createdAt: Date.now() });
  memoInput.value = '';
  save();
}
memoInput.addEventListener('keydown', e => { if (e.key === 'Enter') addMemo(); });
document.getElementById('memoAdd').addEventListener('click', addMemo);
function renderMemos() {
  const sorted = [...state.memos].sort((a, b) => (b.pinned - a.pinned) || (b.createdAt - a.createdAt));
  if (!sorted.length) { memoList.innerHTML = '<div class="empty">还没有记录，从上面输入一条吧。</div>'; return; }
  memoList.innerHTML = '';
  sorted.forEach(m => {
    const div = document.createElement('div');
    div.className = 'memo' + (m.done ? ' done' : '') + (m.pinned ? ' pinned' : '');
    const t = new Date(m.createdAt);
    div.innerHTML = `
      <div class="m-body">
        <div class="m-text"></div>
        <div class="m-time">${dateKey(t)} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</div>
      </div>
      <div class="m-actions">
        <button class="btn btn-xs" data-act="pin">${m.pinned ? '取消置顶' : '置顶'}</button>
        <button class="btn btn-xs" data-act="done">${m.done ? '还原' : '完成'}</button>
        <button class="btn btn-xs" data-act="toquad">转四象限</button>
        <button class="btn btn-xs" data-act="del">删除</button>
      </div>`;
    div.querySelector('.m-text').textContent = m.text;
    div.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const act = btn.dataset.act;
      if (act === 'pin') { m.pinned = !m.pinned; save(); }
      else if (act === 'done') { m.done = !m.done; if (m.done) markDoneToday(); save(); }
      else if (act === 'del') { state.memos = state.memos.filter(x => x.id !== m.id); save(); }
      else if (act === 'toquad') {
        state.quad[1].push({ id: uid(), text: m.text, done: false, createdAt: Date.now() });
        state.memos = state.memos.filter(x => x.id !== m.id);
        save();
        document.querySelector('button[data-pane="quad"]').click();
      }
    });
    memoList.appendChild(div);
  });
}

/* ================= 逻辑本（横格纸） ================= */
document.getElementById('noteSave').addEventListener('click', addNote);
function addNote() {
  const content = document.getElementById('noteContent').value;
  if (!content.trim()) return;
  state.notes.unshift({ id: uid(), content, createdAt: Date.now() });
  document.getElementById('noteContent').value = '';
  save();
}
function renderNotes() {
  const list = document.getElementById('noteList');
  if (!state.notes.length) { list.innerHTML = '<div class="empty">还没有笔记，在上面随便写点什么吧。</div>'; return; }
  list.innerHTML = '';
  [...state.notes].sort((a, b) => b.createdAt - a.createdAt).forEach(n => {
    const div = document.createElement('div');
    div.className = 'note-item';
    const t = new Date(n.createdAt);
    div.innerHTML = `
      <div class="n-time">${dateKey(t)} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}</div>
      <div class="n-body"></div>
      <button class="btn btn-xs n-del">删除</button>`;
    div.querySelector('.n-body').textContent = n.content;
    div.querySelector('.n-del').addEventListener('click', () => {
      state.notes = state.notes.filter(x => x.id !== n.id);
      save();
    });
    list.appendChild(div);
  });
}

function renderDecisions() {
  if (!state.decisions.length) { decList.innerHTML = '<div class="empty">暂无决策主题。</div>'; return; }
  decList.innerHTML = '';
  state.decisions.forEach(d => {
    const div = document.createElement('div');
    div.className = 'dec-item' + (d.id === currentDecId ? ' active' : '');
    const optCount = d.options.length;
    div.innerHTML = `<div class="d-title"></div><div class="dec-meta">${optCount} 个选项 · ${d.conclusion ? '已结论' : '分析中'}</div>`;
    div.querySelector('.d-title').textContent = d.title;
    div.addEventListener('click', () => { currentDecId = d.id; renderDecisions(); renderDecDetail(); });
    decList.appendChild(div);
  });
  renderDecDetail();
}
function renderDecDetail() {
  const d = state.decisions.find(x => x.id === currentDecId);
  if (!d) { decDetail.innerHTML = '<div class="empty">选择一个决策主题，或新建一个。</div>'; return; }
  decDetail.innerHTML = `
    <div class="field"><label>目标 / 背景</label><textarea id="decGoal"></textarea></div>
    <div class="field"><label>选项（含利弊）</label><div id="decOptions"></div>
      <button class="btn btn-xs" id="decAddOpt" style="margin-top:8px;">+ 加选项</button></div>
    <div class="field"><label>评判维度（决策矩阵）</label>
      <div class="chip-row" id="decCriteria"></div>
      <div style="display:flex;gap:8px;margin-top:6px;">
        <input type="text" id="decCriInput" placeholder="维度名，如：成本 / 风险 / 收益" style="flex:1;">
        <button class="btn btn-xs" id="decAddCri">添加</button>
      </div></div>
    <div class="field"><label>决策矩阵</label><div class="matrix" id="decMatrix"></div></div>
    <div class="field"><label>结论</label><textarea id="decConclusion"></textarea></div>
  `;
  const goal = decDetail.querySelector('#decGoal');
  goal.value = d.goal;
  goal.addEventListener('input', () => { d.goal = goal.value; save(); });

  const conclusion = decDetail.querySelector('#decConclusion');
  conclusion.value = d.conclusion;
  conclusion.addEventListener('input', () => { d.conclusion = conclusion.value; save(); });

  renderDecOptions(d);
  renderDecCriteria(d);
  renderDecMatrix(d);
  decDetail.querySelector('#decAddOpt').addEventListener('click', () => {
    d.options.push({ id: uid(), name: '', pros: [], cons: [] });
    renderDecOptions(d); renderDecMatrix(d); save();
  });
  decDetail.querySelector('#decAddCri').addEventListener('click', () => {
    const v = decDetail.querySelector('#decCriInput').value.trim();
    if (!v) return;
    d.criteria.push(v);
    decDetail.querySelector('#decCriInput').value = '';
    renderDecCriteria(d); renderDecMatrix(d); save();
  });
}
function renderDecOptions(d) {
  const wrap = decDetail.querySelector('#decOptions');
  wrap.innerHTML = '';
  d.options.forEach((opt, oi) => {
    const box = document.createElement('div');
    box.className = 'option-box';
    box.innerHTML = `
      <div class="option-head">
        <input type="text" class="opt-name" placeholder="选项 ${oi + 1} 名称" style="flex:1;">
        <button class="btn btn-xs opt-del" ${d.options.length <= 1 ? 'style="visibility:hidden"' : ''}>删除</button>
      </div>
      <div class="procon">
        <div class="col"><h5>利（优势）</h5><div class="pros"></div>
          <input type="text" class="pro-input" placeholder="+ 利" style="margin-top:4px;"></div>
        <div class="col"><h5>弊（劣势）</h5><div class="cons"></div>
          <input type="text" class="con-input" placeholder="+ 弊" style="margin-top:4px;"></div>
      </div>`;
    const nameInput = box.querySelector('.opt-name');
    nameInput.value = opt.name;
    nameInput.addEventListener('input', () => { opt.name = nameInput.value; save(); });
    box.querySelector('.opt-del').addEventListener('click', () => {
      d.options = d.options.filter(o => o.id !== opt.id);
      renderDecOptions(d); renderDecMatrix(d); save();
    });
    const attachTag = (container, arr, input) => {
      arr.forEach((item, i) => {
        const s = document.createElement('span');
        s.className = 'tag';
        s.textContent = item;
        s.style.cursor = 'pointer';
        s.title = '点击删除';
        s.addEventListener('click', () => { arr.splice(i, 1); renderDecOptions(d); save(); });
        container.appendChild(s);
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.target.value.trim()) {
          arr.push(e.target.value.trim()); e.target.value = '';
          renderDecOptions(d); save();
        }
      });
    };
    attachTag(box.querySelector('.pros'), opt.pros, box.querySelector('.pro-input'));
    attachTag(box.querySelector('.cons'), opt.cons, box.querySelector('.con-input'));
    wrap.appendChild(box);
  });
}
function renderDecCriteria(d) {
  const wrap = decDetail.querySelector('#decCriteria');
  wrap.innerHTML = '';
  d.criteria.forEach((c, ci) => {
    const s = document.createElement('span');
    s.className = 'tag';
    s.textContent = c;
    s.style.cursor = 'pointer';
    s.title = '点击删除';
    s.addEventListener('click', () => {
      d.criteria.splice(ci, 1);
      d.options.forEach(o => { d.scores[o.id] = d.scores[o.id] || {}; delete d.scores[o.id][c]; });
      renderDecCriteria(d); renderDecMatrix(d); save();
    });
    wrap.appendChild(s);
  });
  if (!d.criteria.length) wrap.innerHTML = '<span class="empty">暂无维度，添加后即可打分对比。</span>';
}
function renderDecMatrix(d) {
  const wrap = decDetail.querySelector('#decMatrix');
  if (!d.criteria.length || d.options.length < 2) {
    wrap.innerHTML = '<div class="empty">需要至少 1 个维度、2 个选项才能生成决策矩阵。</div>';
    return;
  }
  let html = '<table><thead><tr><th>选项 \\ 维度</th>';
  d.criteria.forEach(c => html += `<th>${esc(c)}</th>`);
  html += '<th>总分</th></tr></thead><tbody>';
  const totals = d.options.map(o => {
    let sum = 0;
    d.criteria.forEach(c => { sum += Number(d.scores[o.id]?.[c] || 0); });
    return sum;
  });
  const best = Math.max(...totals);
  d.options.forEach((o, oi) => {
    html += `<tr class="${totals[oi] === best && best > 0 ? 'best' : ''}"><td style="text-align:left;">${esc(o.name || '选项 ' + (oi + 1))}</td>`;
    d.criteria.forEach((c, ci) => {
      const v = d.scores[o.id]?.[c] ?? 0;
      html += `<td class="cell-score"><input type="number" min="0" max="3" value="${v}" data-opt="${o.id}" data-ci="${ci}"></td>`;
    });
    html += `<td><strong>${totals[oi]}</strong></td></tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
  wrap.querySelectorAll('input[type="number"]').forEach(inp => {
    inp.addEventListener('input', () => {
      const optId = inp.dataset.opt, cri = d.criteria[Number(inp.dataset.ci)];
      if (cri === undefined) return;
      d.scores[optId] = d.scores[optId] || {};
      d.scores[optId][cri] = Math.max(0, Math.min(3, Number(inp.value) || 0));
      renderDecMatrix(d); save();
    });
  });
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ================= 计划本 ================= */
let planDate = dateKey();
function shiftDate(delta) {
  const d = new Date(planDate + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  planDate = dateKey(d);
  renderPlan();
}
document.getElementById('planPrev').addEventListener('click', () => shiftDate(-1));
document.getElementById('planNext').addEventListener('click', () => shiftDate(1));
document.getElementById('planToday').addEventListener('click', () => { planDate = dateKey(); renderPlan(); });
document.getElementById('planAddBtn').addEventListener('click', addPlan);

function addPlan() {
  const title = document.getElementById('planTitle').value.trim();
  const time = document.getElementById('planTime').value.trim();
  if (!title) return;
  state.plans[planDate] = state.plans[planDate] || [];
  state.plans[planDate].push({ id: uid(), title, time, done: false });
  document.getElementById('planTitle').value = '';
  document.getElementById('planTime').value = '';
  save();
}
document.getElementById('planTitle').addEventListener('keydown', e => { if (e.key === 'Enter') addPlan(); });
function renderPlan() {
  document.getElementById('planDate').textContent = planDate + (planDate === dateKey() ? '（今天）' : '');
  const items = (state.plans[planDate] || []).slice().sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  const doneCount = items.filter(i => i.done).length;
  document.getElementById('planStats').innerHTML =
    `已排 <strong>${items.length}</strong> 项 · 已完成 <strong>${doneCount}</strong> 项`;
  const table = document.getElementById('planTable');
  table.innerHTML = '';
  if (!items.length) { table.innerHTML = '<div class="empty">还没有计划，从上面添加一条吧。</div>'; return; }
  items.forEach(it => {
    const row = document.createElement('div');
    row.className = 'plan-row' + (it.done ? ' done' : '');
    row.innerHTML = `
      <input type="checkbox" class="pr-check" ${it.done ? 'checked' : ''}>
      <div class="pr-time"></div>
      <div class="pr-title"></div>
      <button class="pr-del" title="删除">×</button>`;
    row.querySelector('.pr-time').textContent = it.time || '';
    row.querySelector('.pr-title').textContent = it.title;
    row.querySelector('.pr-check').addEventListener('change', e => {
      it.done = e.target.checked;
      if (it.done) markDoneToday();
      save();
    });
    row.querySelector('.pr-del').addEventListener('click', () => {
      state.plans[planDate] = state.plans[planDate].filter(x => x.id !== it.id);
      save();
    });
    table.appendChild(row);
  });
}

/* ================= 回顾 ================= */
function renderReview() {
  // 本周（周一为起点）
  const now = new Date();
  const dow = (now.getDay() + 6) % 7; // 周一=0
  const monday = new Date(now); monday.setDate(now.getDate() - dow);
  const days = [];
  let weekPlanDone = 0, weekPlanTotal = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const key = dateKey(d);
    const plans = state.plans[key] || [];
    weekPlanTotal += plans.length;
    weekPlanDone += plans.filter(p => p.done).length;
    days.push({ key, label: '周' + '日一二三四五六'[d.getDay()], done: plans.filter(p => p.done).length, total: plans.length });
  }
  const weekEl = document.getElementById('reviewWeek');
  weekEl.innerHTML = `<div style="margin-bottom:12px;">本周完成计划 <strong>${weekPlanDone}</strong> / ${weekPlanTotal} 项</div>`;
  days.forEach(d => {
    const row = document.createElement('div');
    row.className = 'bar-row';
    const pct = d.total ? Math.round(d.done / d.total * 100) : 0;
    row.innerHTML = `<span class="bar-label">${d.label}（${d.done}/${d.total}）</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span class="bar-num">${pct}%</span>`;
    weekEl.appendChild(row);
  });
  // 四象限完成分布（累计所有任务）
  const quadEl = document.getElementById('reviewQuad');
  const qDone = state.quad.map(q => q.filter(t => t.done).length);
  const totalDone = qDone.reduce((a, b) => a + b, 0);
  quadEl.innerHTML = '';
  QUAD_NAMES.forEach((name, i) => {
    const row = document.createElement('div');
    row.className = 'bar-row';
    const pct = totalDone ? Math.round(qDone[i] / totalDone * 100) : 0;
    row.innerHTML = `<span class="bar-label">${name}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span class="bar-num">${qDone[i]}</span>`;
    quadEl.appendChild(row);
  });
}

/* ================= 复盘本 ================= */
function renderReviews() {
  const dateInput = document.getElementById('reflectDate');
  if (dateInput && !dateInput.value) dateInput.value = dateKey();
  const list = document.getElementById('reflectList');
  const sorted = [...state.reviews].sort((a, b) => (b.date).localeCompare(a.date) || (b.createdAt - a.createdAt));
  if (!sorted.length) { list.innerHTML = '<div class="empty">还没有复盘，从上面写下今天的第一个反思吧。</div>'; return; }
  list.innerHTML = '';
  sorted.forEach(r => {
    const div = document.createElement('div');
    div.className = 'reflect-item';
    div.innerHTML = `
      <div class="r-date">${esc(r.date)}</div>
      <div class="r-block"><h5>执行力上做得不好</h5><p></p></div>
      <div class="r-block"><h5>如何改进</h5><p></p></div>
      <div class="r-block"><h5>经验 · 体会</h5><p></p></div>
      <button class="btn btn-xs r-del">删除</button>`;
    const ps = div.querySelectorAll('p');
    ps[0].textContent = r.bad || '（未填写）';
    ps[1].textContent = r.improve || '（未填写）';
    ps[2].textContent = r.lesson || '（未填写）';
    div.querySelector('.r-del').addEventListener('click', () => {
      state.reviews = state.reviews.filter(x => x.id !== r.id);
      save();
    });
    list.appendChild(div);
  });
}
function addReview() {
  const bad = document.getElementById('reflectBad').value.trim();
  const improve = document.getElementById('reflectImprove').value.trim();
  const lesson = document.getElementById('reflectLesson').value.trim();
  if (!bad && !improve && !lesson) return;
  state.reviews.push({
    id: uid(),
    date: document.getElementById('reflectDate').value || dateKey(),
    bad, improve, lesson, createdAt: Date.now()
  });
  document.getElementById('reflectBad').value = '';
  document.getElementById('reflectImprove').value = '';
  document.getElementById('reflectLesson').value = '';
  save();
}
document.getElementById('reflectSave').addEventListener('click', addReview);

/* ================= 全局渲染 ================= */
function renderAll() {
  renderQuad();
  renderMemos();
  renderNotes();
  renderPlan();
  renderReviews();
  renderReview();
  const st = document.getElementById('streakTxt');
  st.textContent = '连续坚持 ' + state.streak.count + ' 天';
  const p = computeProgress();
  document.getElementById('progressFill').style.width = p.pct + '%';
  document.getElementById('progressTxt').textContent = '今日完成 ' + p.pct + '%' + (p.total ? `（${p.done}/${p.total}）` : '');
}

// 点击移动菜单以外的区域时关闭菜单
document.addEventListener('click', e => {
  if (!e.target.closest('.move-menu') && !e.target.closest('.move')) {
    document.querySelectorAll('.move-menu').forEach(m => m.remove());
  }
});

renderAll();
